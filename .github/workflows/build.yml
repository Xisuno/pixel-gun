name: Build PG3D Cheat — DEB

on:
  push:
    branches: [ main, master ]
    paths:
      - 'pg3d_tweak/**/Sources/**'
      - 'pg3d_tweak/**/Makefile'
      - 'pg3d_tweak/**/control'
      - 'pg3d_tweak/**/layout/**'
  workflow_dispatch:
    inputs:
      finalpackage:
        description: 'FINALPACKAGE (strips debug symbols)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-15

    steps:
      # ── 1. Sources ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Locate Makefile — handle both flat and double-nested layouts ────────
      # Expected clean layout:  pg3d_tweak/Makefile
      # Legacy double-nested:   pg3d_tweak/pg3d_tweak/Makefile
      - name: Locate project root
        id: project
        run: |
          WORKSPACE="${{ github.workspace }}"
          if [ -f "$WORKSPACE/pg3d_tweak/Makefile" ]; then
            PROJECT_ROOT="$WORKSPACE/pg3d_tweak"
          elif [ -f "$WORKSPACE/pg3d_tweak/pg3d_tweak/Makefile" ]; then
            PROJECT_ROOT="$WORKSPACE/pg3d_tweak/pg3d_tweak"
            echo "::warning::Double-nested layout detected (pg3d_tweak/pg3d_tweak/)."
            echo "::warning::Re-run the unzip workflow with destination=. to fix the repo structure."
          else
            echo "ERROR: Makefile not found. Repo tree:"
            find "$WORKSPACE" -maxdepth 4 -not -path '*/.git/*' -not -path '*/theos/*' | sort
            exit 1
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Found: $PROJECT_ROOT/Makefile"
          grep "include.*tweak.mk" "$PROJECT_ROOT/Makefile"

      # ── 3. System dependencies (Homebrew) ─────────────────────────────────────
      # ldid  → fake-signing of the dylib (required by Theos)
      # dpkg  → dpkg-deb for packaging and --info verification
      # make  → GNU make 4.x (macOS ships 3.81); exposed as `make` via gnubin
      - name: Install system packages
        run: |
          brew update
          brew install ldid dpkg make xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      # ── 4. Theos core ─────────────────────────────────────────────────────────
      - name: Clone Theos
        run: |
          git clone --recursive --depth=1 \
            https://github.com/theos/theos.git "$THEOS"

      # ── 5. Toolchain ──────────────────────────────────────────────────────────
      # On macOS Theos uses the Xcode clang directly — no Linux toolchain needed.
      - name: Check Xcode toolchain
        run: |
          xcode-select -p
          clang --version
          make --version | head -1

      # ── 6. iOS 16.5 SDK ───────────────────────────────────────────────────────
      - name: Download iOS 16.5 SDK
        run: |
          SDK_URL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          mkdir -p "$THEOS/sdks"
          curl -fL "$SDK_URL" -o sdk.tar.xz
          tar -xf sdk.tar.xz -C "$THEOS/sdks/"
          rm sdk.tar.xz
          ls "$THEOS/sdks/"

      # ── 7. Build ──────────────────────────────────────────────────────────────
      - name: Build .deb package
        run: |
          FINAL=$( [ "${{ github.event.inputs.finalpackage }}" = "false" ] && echo "0" || echo "1" )
          cd "${{ steps.project.outputs.PROJECT_ROOT }}"
          make package \
            FINALPACKAGE=$FINAL \
            THEOS_PACKAGE_SCHEME=rootless \
            -j$(sysctl -n hw.ncpu)

      # ── 8. Verify output ──────────────────────────────────────────────────────
      - name: Verify .deb produced
        run: |
          PKGDIR="${{ steps.project.outputs.PROJECT_ROOT }}/packages"
          ls -lh "$PKGDIR"
          DEB=$(find "$PKGDIR" -name '*.deb' | head -1)
          if [ -z "$DEB" ]; then
            echo "ERROR: no .deb found"
            exit 1
          fi
          dpkg-deb --info "$DEB"

      # ── 9. Upload artifact ────────────────────────────────────────────────────
      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg3d-cheat-${{ github.run_number }}-deb
          path: ${{ steps.project.outputs.PROJECT_ROOT }}/packages/*.deb
          if-no-files-found: error
          retention-days: 30
