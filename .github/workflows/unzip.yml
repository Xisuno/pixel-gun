name: Unzip into Repository

# Trigger: manual only.
# Provide the path of a .zip already present in the repo (committed or uploaded via API),
# and the destination directory where its contents will be extracted and committed.
on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Repo-relative path to the .zip file (e.g. releases/pg3d_cheat_mc1h.zip)'
        required: true
        default: 'pg3d_cheat_mc1h.zip'
      destination:
        description: 'Repo-relative destination directory for extracted contents'
        required: true
        default: 'pg3d_tweak'
      commit_message:
        description: 'Commit message'
        required: false
        default: 'ci: unzip cheat sources into repo [mc1h]'

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for git push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate zip exists
        run: |
          if [ ! -f "${{ github.event.inputs.zip_path }}" ]; then
            echo "ERROR: zip not found at ${{ github.event.inputs.zip_path }}"
            echo "Commit the zip to the repository before running this workflow."
            exit 1
          fi

      - name: Extract zip
        run: |
          DEST="${{ github.event.inputs.destination }}"
          mkdir -p "$DEST"
          unzip -o "${{ github.event.inputs.zip_path }}" -d "$DEST"
          echo "=== Extracted files ==="
          find "$DEST" -type f | sort

      - name: Commit extracted contents
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.destination }}"
          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit — extracted contents already match the repository."
          else
            git commit -m "${{ github.event.inputs.commit_message }}"
            git push
          fi
