name: Build PG3D Cheat DEB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Theos dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            curl git make perl rsync zip unzip \
            clang lld \
            libc6-dev-i386 libxml2 libplist-utils

      # 3. Set up Theos
      - name: Set up Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          # Download iOS 16.5 SDK
          mkdir -p "$THEOS/sdks"
          curl -LO https://github.com/theos/sdks/releases/download/main/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C "$THEOS/sdks/"
          rm iPhoneOS16.5.sdk.tar.xz
          # Download arm64e clang cross-compiler bundled with Theos
          curl -LO https://github.com/nicowillis/cctools-port/releases/latest/download/cctools-port-linux.tar.gz
          tar -xf cctools-port-linux.tar.gz -C "$THEOS"
          rm cctools-port-linux.tar.gz

      # 4. Build .deb
      - name: Build tweak
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          cd ${{ github.workspace }}
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      # 5. Upload .deb artifact
      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg3d-cheat-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30
