name: Unzip Cheat Release

on:
  workflow_dispatch:
    inputs:
      zip_artifact_name:
        description: 'Name of the uploaded ZIP artifact to unzip'
        required: true
        default: 'pg3d-cheat-deb'

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Download the ZIP artifact produced by the build workflow
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.zip_artifact_name }}
          path: ./downloaded

      # If the artifact is a ZIP (e.g. uploaded manually), unzip it
      - name: Unzip if needed
        run: |
          cd downloaded
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Unzipping $f"
              unzip -o "$f" -d unzipped/
            fi
          done
          ls -lh

      # List contents
      - name: Show contents
        run: |
          echo "=== downloaded/ ==="
          find downloaded/ -type f | sort

      # Re-upload unzipped contents as a new artifact
      - name: Upload unzipped contents
        uses: actions/upload-artifact@v4
        with:
          name: pg3d-cheat-unzipped
          path: downloaded/
          retention-days: 30
